name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # Root deps (optional)
      - name: Install root dependencies
        run: if [ -f package.json ]; then pnpm install --frozen-lockfile; fi

      # Frontend deps
      - name: Install frontend dependencies
        run: cd front && pnpm install --frozen-lockfile

      # Firebase Functions deps
      - name: Install Firebase Functions dependencies
        run: cd functions && pnpm install --frozen-lockfile

      # Build frontend
      - name: Build frontend
        run: cd front && pnpm generate
        env:
          NODE_ENV: production
          ENVIRONMENT: production
          NUXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          NUXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          NUXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          NUXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          NUXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          NUXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          NUXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
      # Build Firebase Functions
      - name: Build Firebase Functions
        run: cd functions && pnpm build

      - name: '🚀 Deploy to Firebase'
        uses: w9jds/firebase-action@v15.10.1
        with:
          args: deploy --only functions,hosting,firestore,storage --project park-alert --force
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PARK_ALERT_PROD }}
