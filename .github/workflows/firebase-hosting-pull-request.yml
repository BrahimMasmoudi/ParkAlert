name: Deploy to Firebase Hosting on PR
on: pull_request

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  # JOB 1: Install Dependencies
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Cache Node Modules
        id: cache-modules
        uses: actions/cache@v5
        with:
          path: |
            front/node_modules
            functions/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('front/pnpm-lock.yaml', 'functions/pnpm-lock.yaml') }}

      - name: Install All Dependencies
        run: |
          cd front && pnpm install --frozen-lockfile --ignore-scripts
          cd ../functions && pnpm install --frozen-lockfile

  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Restore Cache
        uses: actions/cache@v5
        with:
          path: |
            front/node_modules
            functions/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('front/pnpm-lock.yaml', 'functions/pnpm-lock.yaml') }}

      - name: Generate Frontend
        run: |
          cd front
          pnpm nuxi prepare
          pnpm generate
        env:
          NODE_ENV: staging
          ENVIRONMENT: staging
          NUXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          NUXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          NUXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          NUXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          NUXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          NUXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          NUXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
        
      - name: Build Backend (Functions)
        run: cd functions && pnpm build

      - name: '🚀 Deploy to Firebase'
        uses: w9jds/firebase-action@v15.10.1
        with:
          args: deploy --only functions,hosting,firestore,storage --project park-alert-staging --force
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PARK_ALERT_STAGING }}
    
  e2e-test:
    needs: deploy
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Cypress run
        uses: cypress-io/github-action@v7
        env:
          CYPRESS_BASE_URL: https://park-alert-staging.web.app/
          CYPRESS_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PARK_ALERT_STAGING }}
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PARK_ALERT_STAGING }}
          CYPRESS_FIREBASE_APPCHECK_DEBUG_TOKEN: ${{ secrets.CYPRESS_FIREBASE_APPCHECK_DEBUG_TOKEN }}
        with:
          working-directory: e2e
          browser: firefox
          install-command: pnpm install --frozen-lockfile
          summary-title: 'Chrome Staging E2E'

      - name: Upload Cypress artifacts
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cypress-results
          path: |
            ${{ github.workspace }}/e2e/cypress/screenshots
            ${{ github.workspace }}/e2e/cypress/videos
          if-no-files-found: warn